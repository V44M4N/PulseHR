# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.fullstack.yml — FULL STACK DEV (everything in containers)
#
# Use when:
#   • Onboarding a new dev (no local Node needed)
#   • Running CI pipelines
#   • Testing the full container networking locally
#
# Usage:
#   docker compose -f docker-compose.fullstack.yml up
#
# Hot reload:  backend source is volume-mounted → ts-node-dev restarts on save
# Frontend:    Vite dev server with HMR on :8080
# ─────────────────────────────────────────────────────────────────────────────

name: pulsehr-fullstack

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pulsehr}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data_fs:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulsehr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_fs:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend (hot reload via ts-node-dev) ────────────────────────────────────
  backend:
    image: node:20-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./backend:/app              # source hot-reload
      - backend_node_modules:/app/node_modules
    env_file: .env
    environment:
      # Override localhost hostnames with Docker service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-pulsehr}
      REDIS_URL:    redis://redis:6379
      NODE_ENV:     development
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "apt-get update -y -qq && apt-get install -y -q openssl &&
             npm install &&
             npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             { npx ts-node prisma/seed.ts || echo 'Seed already applied, skipping.'; } &&
             npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/v1/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Vite HMR dev server) ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./frontend:/app             # source hot-reload
      - frontend_node_modules:/app/node_modules
    environment:
      # Vite env vars — passed directly (no envDir lookup needed inside container)
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      VITE_APP_NAME:     ${VITE_APP_NAME:-PulseHR}
      VITE_ENABLE_MOCK:  "false"
    ports:
      - "8080:8080"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data_fs:
  redis_data_fs:
  backend_node_modules:
  frontend_node_modules:
